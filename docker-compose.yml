services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ~/.aws:/home/app/.aws:ro
    depends_on:
      - qdrant
    develop:
      watch:
        - action: sync+restart
          path: ./app
          target: /app/app

volumes:
  qdrant_data:
